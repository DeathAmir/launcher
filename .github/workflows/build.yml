name: "Build"
on:
  workflow_dispatch:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"

jobs:
  build-omp-launcher:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2024-01-01

      - name: Install frontend dependencies
        run: yarn install

      - name: Install rust i686-pc-windows-msvc target
        run: rustup target add i686-pc-windows-msvc

      - name: Build frontend
        run: yarn build

      - name: Build launcher (8 jobs)
        working-directory: src-tauri
        run: cargo build --release --target i686-pc-windows-msvc -j 8

      - name: Prepare unsigned launcher
        shell: pwsh
        run: |
          Copy-Item `
            -LiteralPath "src-tauri/target/i686-pc-windows-msvc/release/omp-launcher.exe" `
            -Destination "iRx-Launcher.exe" `
            -Force

      - name: Upload unsigned launcher
        uses: actions/upload-artifact@v7
        id: upload-launcher
        with:
          path: iRx-Launcher.exe
          if-no-files-found: error
          archive: false
